name: unittests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unittests:
    timeout-minutes: 15
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        # Per Python version: the oldest pandas with prebuilt wheels for it,
        # and the latest pandas pip resolves (already installed by the eager upgrade).
        include:
          - python-version: '3.12'
            libraries-versions: 'pandas==2.1.1 "numpy<2.0"'
          - python-version: '3.12'
            libraries-versions: 'pandas'
          - python-version: '3.13'
            libraries-versions: 'pandas==2.2.3'
          - python-version: '3.13'
            libraries-versions: 'pandas'
          - python-version: '3.14'
            libraries-versions: 'pandas==2.3.3'
          - python-version: '3.14'
            libraries-versions: 'pandas'
          # No oldest-pandas entry yet: pick the first pandas with 3.15 wheels once known
          - python-version: '3.15'
            libraries-versions: 'pandas'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies ${{ matrix.python-version }}
        run: |
          # --group needs pip 25.1 or newer
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[pandas]" --group test
          pip install ${{ matrix.libraries-versions }}

      - name: Run tests
        run: |
          python -m pytest -vv

  no-pandas:
    timeout-minutes: 15
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          - python-version: '3.14'
          - python-version: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies without pandas ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group test

      # The core install must not pull pandas or numpy.
      # If a new dependency pulls pandas, this step fails.
      - name: Fail if pandas or numpy is installed
        run: |
          python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pandas', 'numpy')))"

      # test_util.py imports pandas at module level, so skip it here.
      - name: Run tests without pandas
        run: |
          python -m pytest -vv --ignore=unittest/test_util.py

