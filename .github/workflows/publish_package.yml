name: "[DISABLED in fork] Publish package"

on:
  workflow_run:
    workflows: ["[DISABLED in fork] Create Release"]
    types:
      - completed

jobs:
  publish-package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      # This fork is installed with `pip install git+...` and is never released to PyPI
      - name: Fail, releases are disabled in this fork
        run: |
          echo "Releases are disabled in this fork, install it with pip install git+https://github.com/joonh-min/volue-insight-timeseries.git" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - run: pip install -U build twine

      - name: Read version
        id: read-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checked-out commit is the one "Create Release" tagged. Pick the
          # newest release pointing at it; when an rc and the final release
          # share a commit, the newest is the one that run created. Drafts are
          # excluded because their tag does not exist yet.
          head_sha=$(git rev-parse HEAD)
          # Captured first so a gh failure aborts here instead of being
          # swallowed by a process substitution.
          candidates=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --json tagName --jq '.[].tagName')
          tag_name=""
          while read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            candidate_sha=$(git rev-parse --verify --quiet "${candidate}^{commit}" || true)
            if [[ "${candidate_sha}" == "${head_sha}" ]]; then
              tag_name="${candidate}"
              break
            fi
          done <<< "${candidates}"
          if [[ -z "${tag_name}" ]]; then
            echo "No release points at the checked-out commit ${head_sha}" >&2
            exit 1
          fi
          # The version lives in pyproject.toml, set it to the release tag for this build
          sed -i "s/^version = \".*\"$/version = \"${tag_name}\"/" pyproject.toml
          grep -qx "version = \"${tag_name}\"" pyproject.toml
          echo "VERSION=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Build dist
        id: build-dist
        run: |
          rm -rf dist
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
